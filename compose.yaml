services:
  aawa-mcpx:
    # entrypoint: ["/bin/ash", "-eu", "-o", "pipefail", "-c"]
    # command: ["sleep 1h"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aawa-mcpx
    environment:
      NODE_ENV: production
    ports:
      - "4567:4567"
    volumes:
      # Mount the secrets next to the image's .env, where Bun loads them
      - ./.env.local:/home/app/.env.local:ro
      # Mount mcp.json for configuration
      - ./mcp.json:/home/app/mcp.json:rw
      # Mount db directory for SQLite persistence
      - ./db:/home/app/db
    # Docker cannot restart by exit code, so any failure gets 3 more tries.
    restart: on-failure:3

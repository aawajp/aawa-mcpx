# Set sensible defaults for Bun (can be overriden by CLI arguments)
# https://bun.sh/docs/runtime/bunfig

# disable telemetry
telemetry = false

[install]
	# do not auto-install dependencies
	auto = "disable"

	# prefer exact package versions in package.json
	exact = true

	# do not install dependencies more recent than 4 days to mitigate risk of hijacks
	minimumReleaseAge = 345600

[run]
	# execute "run" commands with "bun" instead of "node" (note: bun's default is "node"
	bun = true

# TODO: update when there's a long term solution for tailwind integration:
# - https://github.com/oven-sh/bun/issues/12878
# - https://github.com/oven-sh/bun/issues/29603
[serve.static]
plugins = ["bun-plugin-tailwind"]
env = "BUN_PUBLIC_*"
